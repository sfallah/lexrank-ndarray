[package]
name = "lexrank-ndarray"
version = "0.1.0"
edition = "2021"

[dependencies]
ndarray = { version = "0.17.2", features = ["rayon", "matrixmultiply-threading"] }
rayon = "1.10.0"

anyhow = "1.0.89"
accelerate-src = { version = "0.3.2", optional = true }
openblas-src = { version = "0.10.16", optional = true }
cblas = "0.5.0"
# Optional dependencies for test and benchmarks
ndarray-rand = { version = "0.16.0", optional = true }
memmap2 = { version = "0.9.5", optional = true }
safetensors = { version = "0.8.0", optional = true }
serde_json = { version = "1.0.128", optional = true }
serde = { version = "1.0.208", features = ["derive"], optional = true }
simsimd = "6.5.0"
rand = "0.9.2"



[dev-dependencies]
criterion = { version = "0.8.2", default-features = false }

[features]
default = []
# One backend per platform, each the fastest measured there: Accelerate on macOS, OpenBLAS
# everywhere else. BLIS and MKL were benchmarked and dropped; see the commit that removed them.
accelerate = ["accelerate-src", "ndarray/blas"]
blas = ["openblas-src", "ndarray/blas"]
# Same OpenBLAS, linked statically: the binary then carries it, which suits slim runtime images.
blas-static = ["openblas-src", "openblas-src/static", "ndarray/blas"]
testing = ["ndarray-rand", "memmap2", "safetensors", "serde_json", "serde"]

[[test]]
name = "tests"
required-features = ["testing"]


[[bench]]
name = "benchmarks"
harness = false

# Cargo.toml
[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"          # or "fat" if you want maximum inlining at the cost of link time
debug = false
incremental = false

[profile.bench]
inherits = "release"  # if your Cargo is recent; otherwise repeat the keys
