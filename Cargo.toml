[package]
name = "lexrank-ndarray"
version = "0.1.0"
edition = "2021"


[dependencies]
ndarray = { version = "0.16.1" }
rayon = "1.10.0"

anyhow = "1.0.89"
accelerate-src = { version = "0.3.2", optional = true }
intel-mkl-src = { version = "0.8.1", optional = true }
blis-src = { version = "0.2.2", optional = true }
blas-src = { version = "0.11.1", optional = true }

# Optional dependencies for test and benchmarks
ndarray-rand = { version = "0.15.0", optional = true }
memmap2 = { version = "0.9.5", optional = true }
safetensors = { version = "0.6.0", optional = true }
serde_json = { version = "1.0.128", optional = true }
serde = { version = "1.0.208", features = ["derive"], optional = true }
wide = "0.7.33"
smallvec = "1.15.1"


[dev-dependencies]
criterion = { version = "0.7.0", default-features = false }

[features]
default = []
accelerate = ["accelerate-src", "blas-src/accelerate", "ndarray/blas"]
blas = ["blis-src", "blas-src/blis", "ndarray/blas"]
mkl = ["intel-mkl-src", "blas-src/intel-mkl", "ndarray/blas"]
testing = ["ndarray-rand", "memmap2", "safetensors", "serde_json", "serde"]

[[test]]
name = "tests"
required-features = ["testing"]


[[bench]]
name = "benchmarks"
harness = false


