[package]
name = "ndarray-benches"
version = "0.1.0"
edition = "2021"

[dependencies]
ndarray = "0.16.1"
rayon = "1.10.0"

anyhow = "1.0.89"
#accelerate-src = { version = "0.3.2", optional = true }
#intel-mkl-src = { version = "0.8.1", optional = true }
#blis-src = { version = "0.10", optional = true }
blas-src = { version = "0.10", optional = true }

ndarray-rand = { version = "0.15.0", optional = true }
memmap2 = { version = "0.9.5", optional = true }
safetensors = { version = "0.4.5", optional = true }
serde_json = { version = "1.0.128", optional = true }
serde = { version = "1.0.208", features = ["derive"], optional = true }


[dev-dependencies]
criterion = { version = "0.5.1", default-features = false }

[features]
default = []
benchmarks = ["ndarray-rand", "memmap2", "safetensors", "serde_json", "serde"]
accelerate = ["blas-src/accelerate", "ndarray/blas"]
blas = ["blas-src/blis","ndarray/blas"]
mkl = ["blas-src/intel-mkl", "ndarray/blas"]



[[bench]]
name = "benchmarks"
harness = false