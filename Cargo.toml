[package]
name = "lexrank-ndarray"
version = "0.1.0"
edition = "2021"

[dependencies]
ndarray = { version = "0.16.1", features = ["rayon", "matrixmultiply-threading"] }
rayon = "1.10.0"

anyhow = "1.0.89"
accelerate-src = { version = "0.3.2", optional = true }
openblas-src = { version = "0.10.12", optional = true }
blis-src = { version = "0.2.2", optional = true }
# LP64: the cblas crate and ndarray pass 32-bit ints; the crate's default is ILP64.
intel-mkl-src = { version = "0.8.1", optional = true, features = ["mkl-static-lp64-iomp"] }
cblas = "0.5.0"
# Optional dependencies for test and benchmarks
ndarray-rand = { version = "0.15.0", optional = true }
memmap2 = { version = "0.9.5", optional = true }
safetensors = { version = "0.6.0", optional = true }
serde_json = { version = "1.0.128", optional = true }
serde = { version = "1.0.208", features = ["derive"], optional = true }
simsimd = "6.5.0"
rand = "0.9.2"



[dev-dependencies]
criterion = { version = "0.7.0", default-features = false }

[features]
default = []
accelerate = ["accelerate-src", "ndarray/blas"]
blas = ["openblas-src", "ndarray/blas"]
blis = ["blis-src", "ndarray/blas"]
mkl = ["intel-mkl-src", "ndarray/blas"]
testing = ["ndarray-rand", "memmap2", "safetensors", "serde_json", "serde"]

[[test]]
name = "tests"
required-features = ["testing"]


[[bench]]
name = "benchmarks"
harness = false

# Cargo.toml
[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"          # or "fat" if you want maximum inlining at the cost of link time
debug = false
incremental = false

[profile.bench]
inherits = "release"  # if your Cargo is recent; otherwise repeat the keys
