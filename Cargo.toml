[package]
name = "ndarray-benches"
version = "0.1.0"
edition = "2021"

[dependencies]
ndarray = { version = "0.16.1", features = ["rayon"] }
ndarray-rand = "0.15.0"
#ndarray-linalg = { version = "0.16.0", features = ["intel-mkl-static"], optional= true }
ndarray-linalg = { version = "0.16.0", optional= true }


anyhow = "1.0.44"
accelerate-src = { version = "0.3.2", optional = true }
intel-mkl-src = { version = "0.8.1", optional = true }
openblas-src = { version="0.10.9", optional = true }
blas-src = { version = "0.10", optional = true }


[dev-dependencies]
criterion = { version = "0.5.1", default-features = false }


[features]
default = []
accelerate = ["dep:accelerate-src", "ndarray/blas"]
blas = ["blas-src/blis","ndarray/blas"]
mkl = ["dep:intel-mkl-src", "blas-src/intel-mkl", "ndarray/blas", "ndarray-linalg/intel-mkl-static"]
oblas = ["dep:openblas-src","blas-src/openblas", "ndarray/blas", "ndarray-linalg/openblas-static"]


[[bench]]
name = "benchmarks"
harness = false